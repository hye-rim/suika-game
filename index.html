<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수박 게임</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:radial-gradient(circle at 50% 15%, #ffe6b8 0%, #ffc978 55%, #f2a04a 100%);
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:#5a3210;
    touch-action:none;
  }
  #stage {
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8px;
  }
  #hud {
    display:flex; justify-content:space-between; align-items:flex-end; gap:8px;
    padding:0 4px 6px;
    font-variant-numeric:tabular-nums;
  }
  #hud .item { display:flex; flex-direction:column; line-height:1.1; }
  #hud .label { font-size:10px; letter-spacing:.12em; color:#9a5a1c; font-weight:800; }
  #hud .value { font-size:22px; font-weight:900; }
  #hud .next { display:flex; align-items:center; gap:6px; }
  #nextCanvas { width:36px; height:36px; }
  #hud .icons { display:flex; gap:6px; }
  #hud button {
    background:rgba(255,255,255,.55); border:1px solid rgba(154,90,28,.35); color:#5a3210;
    width:32px; height:32px; border-radius:8px; font-size:14px; cursor:pointer;
  }
  #wrap { position:relative; }
  #game { display:block; touch-action:none; cursor:pointer; }
  #overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:10px;
    text-align:center; padding:20px;
    background:rgba(255,244,222,.86);
    border-radius:18px;
    backdrop-filter:blur(3px);
    overflow-y:auto;
  }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:40px; font-weight:900; color:#2e9e44;
    text-shadow:0 3px 0 #0f5a22, 0 6px 14px rgba(0,0,0,.18); }
  #overlay h2 { font-size:28px; font-weight:900; }
  #overlay p { font-size:14px; line-height:1.6; color:#7a4a1c; }
  #overlay .big { font-size:34px; font-weight:900; color:#e2542a; font-variant-numeric:tabular-nums; }
  #overlay .help { font-size:12px; color:#9a6a3c; line-height:1.7; }
  #overlay button {
    margin-top:6px;
    background:linear-gradient(180deg,#5fd36e,#2e9e44);
    color:#fff; font-weight:900; font-size:17px;
    border:none; border-radius:999px; padding:12px 34px;
    box-shadow:0 4px 0 #1b6b2c; cursor:pointer;
  }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #1b6b2c; }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
      <div class="item"><span class="label">BEST</span><span class="value" id="best">0</span></div>
      <div class="item next"><span class="label">NEXT</span><canvas id="nextCanvas" width="72" height="72"></canvas></div>
      <div class="icons">
        <button id="muteBtn" title="소리 (M)">🔊</button>
        <button id="pauseBtn" title="일시정지 (P)">⏸</button>
      </div>
    </div>
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="overlay">
        <h1>수박 게임</h1>
        <p>같은 과일끼리 부딪히면 <b>한 단계 큰 과일</b>로 합쳐져요.<br>과일이 빨간 선을 넘치지 않게 쌓아 <b>🍉 수박</b>을 만들어 보세요!</p>
        <div class="help">
          🖱️ 마우스로 위치 · 클릭으로 떨어뜨리기<br>
          📱 드래그로 위치 · 손을 떼면 떨어뜨리기<br>
          ⌨️ ← → 이동 · Space 떨어뜨리기
        </div>
        <button id="startBtn">시작하기</button>
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
