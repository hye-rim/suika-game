<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수박 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리는 -webkit- 접두사를 붙여야 알아듣는다: 버튼을 누르다 글자가 파랗게 선택(블록)되거나
     길게 눌러 복사 메뉴가 뜨지 않게. 입력칸은 그대로 선택·붙여넣기 되게 둔다 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, [contenteditable] { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 + 둥근 글꼴 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --muted:#6b5c95; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.07) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #4f8cff 0%, #6b5cff 55%, #8a4fe0 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    touch-action:none;
  }
  #stage {
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8px;
  }
  /* 위 점수판: 알약들 */
  #hud { display:flex; align-items:center; gap:6px; padding:0 2px 8px; font-variant-numeric:tabular-nums; }
  #hud .item {
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:2px 11px; height:38px;
  }
  #hud .item:first-child { background:var(--yellow); flex:1; min-width:0; }
  #hud .label { font-size:11px; color:var(--muted); }
  #hud .value { font-size:21px; }
  #hud .next { padding:2px 4px 2px 10px; }
  #nextCanvas { width:30px; height:30px; }
  #hud .icons { display:flex; gap:6px; margin-left:auto; }
  #hud button {
    background:#fff; border:3px solid var(--ink); color:var(--ink);
    width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer;
    box-shadow:0 4px 0 var(--ink);
  }
  #hud button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  @media (max-width:360px) { #hud .label { display:none; } }
  #wrap { position:relative; }
  #game { display:block; touch-action:none; cursor:pointer; }
  #overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:12px;
    text-align:center; padding:20px;
    background:rgba(43,29,82,.55);
    border-radius:26px;
    backdrop-filter:blur(3px);
    overflow-y:auto;
    touch-action:pan-y;
  }
  #overlay.hidden { display:none; }
  #overlay h1, .inked {
    color:#fff; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink);
  }
  #overlay h1 { font-size:clamp(44px, 13vw, 56px); line-height:1.05; color:#7ee39a; }
  #overlay h2 { font-size:32px; font-weight:400; }
  #overlay p { font-size:15px; line-height:1.6; color:#fff; }
  #overlay p b { color:var(--yellow); font-weight:400; }
  #overlay .big { font-size:44px; color:var(--yellow); font-variant-numeric:tabular-nums; }
  #overlay .help {
    font-size:14px; color:var(--ink); line-height:1.75;
    background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink);
    padding:10px 16px;
  }
  #overlay button {
    margin-top:4px;
    background:var(--yellow); color:var(--ink); font-size:22px; font-family:inherit;
    border:3px solid var(--ink); border-radius:999px; padding:10px 38px;
    box-shadow:0 6px 0 var(--ink); cursor:pointer;
  }
  #overlay button:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  /* 기기에 맞는 설명만: 폰(손가락)은 .touch, PC(마우스·키보드)는 .pc */
  .pc { display:none; }
  @media (pointer:fine) { .pc { display:inline; } .touch { display:none; } }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
      <div class="item"><span class="label">BEST</span><span class="value" id="best">0</span></div>
      <div class="item next"><span class="label">NEXT</span><canvas id="nextCanvas" width="72" height="72"></canvas></div>
      <div class="icons">
        <button id="muteBtn" title="소리 (M)">🔊</button>
        <button id="pauseBtn" title="일시정지 (P)">⏸</button>
      </div>
    </div>
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="overlay">
        <h1>수박 게임</h1>
        <p>같은 과일끼리 부딪히면 <b>한 단계 큰 과일</b>로 합쳐져요.<br>과일이 분홍 선을 넘치지 않게 쌓아 <b>🍉 수박</b>을 만들어 보세요!</p>
        <button id="startBtn">시작하기</button>
        <div class="help">
          <span class="pc">🖱️ 마우스로 위치 · 클릭으로 떨어뜨리기<br>⌨️ ← → 이동 · Space 떨어뜨리기</span>
          <span class="touch">👆 끌어서 위치 · 손을 떼면 떨어뜨리기</span>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
